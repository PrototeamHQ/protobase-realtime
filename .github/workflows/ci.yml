name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Our own runners: GitHub-hosted minutes are billed for a private repository.
    runs-on: hetzner-vm
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The stock Phoenix JavaScript client the integration tests connect with.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tests/phoenixjs
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
