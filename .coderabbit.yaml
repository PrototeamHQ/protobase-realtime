# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Inherits PrototeamHQ/coderabbit/.coderabbit.yaml.
inheritance: true
reviews:
  auto_review:
    # PRs here merge on CodeRabbit's approval, so it must review again after each fix push.
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
